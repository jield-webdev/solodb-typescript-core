name: Publish Package

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack
        run: |
          corepack enable
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Set dev version
        if: github.ref == 'refs/heads/develop'
        run: |
          node -e "const fs=require('fs');const pkg=require('./package.json');const base=pkg.version.split('-')[0];pkg.version=`${base}-dev.${process.env.GITHUB_RUN_NUMBER}`;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"

      - name: Publish dev package to npm
        if: github.ref == 'refs/heads/develop'
        run: npm publish --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
